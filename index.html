<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Keep Sharp is a short browser math practice game for algebra, geometry, and calculus.">
  <meta name="theme-color" content="#101410">
  <title>Keep Sharp — Math Practice</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101410'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' fill='%23e0b15a' font-family='Georgia,serif'%3E%E2%88%AB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <p class="eyebrow">Math practice</p>
        <h1><button type="button" id="brand">Keep Sharp</button></h1>
      </div>
      <div class="stats" id="stats" aria-live="polite"></div>
    </header>
    <main id="view"></main>
    <footer>
      <p>Runs in your browser. Best streak and total answered stay on this device.</p>
    </footer>
  </div>
  <noscript>
    <p>Keep Sharp needs JavaScript. Enable it to practice. There is no account and no server.</p>
  </noscript>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
